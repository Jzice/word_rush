# 版本发布：推送 v* 标签（如 v1.3.0）时创建 GitHub Release，并附带单文件离线版。
# 部署到 GitHub Pages 由 deploy.yml 负责（推送 master / main 或 Actions 页面手动触发），
# 本工作流不再部署——同一提交只部署一次，既避开 github-pages 环境对标签的部署限制，
# 也消除两个工作流并发部署 Pages 的冲突（历史上曾因此加过 sleep 保护）。
# 发布新版本流程：
#   npm run bump 1.3.0 → commit → git tag -a v1.3.0 -m "..." → git push origin master && git push origin v1.3.0
# 注意：标签必须指向"包含本工作流文件"的提交，否则不会触发。

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 与上传附件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: 构建单文件（压缩+内联）
        run: npm run build

      - name: 组装 Release 附件（单文件离线版，带版本号命名）
        run: cp dist/word_rush.html "word_rush_${GITHUB_REF_NAME}.html"

      - name: 上传 Release 附件构件
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${GITHUB_REF_NAME}
          path: word_rush_*.html

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Release 附件
        uses: actions/download-artifact@v4
        with:
          name: release-asset-${GITHUB_REF_NAME}
          path: release-asset

      - name: 创建 GitHub Release（自动生成 Notes + 附加单文件）
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-asset/word_rush_*.html
